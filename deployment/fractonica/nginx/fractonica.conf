map $http_upgrade $fractonica_connection_upgrade {
    default upgrade;
    ''      close;
}

upstream fractonica_api {
    server 127.0.0.1:8788;
    keepalive 16;
}

upstream fractonica_web {
    server 127.0.0.1:3100;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name fractonica.com;
    return 301 https://fractonica.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name fractonica.com;

    ssl_certificate /etc/letsencrypt/live/fractonica.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fractonica.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 5g;
    # Do not include subdomains until every subdomain is HTTPS-only.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location ~ ^/(activity|api-keys|auth|devices|events|health|me|media|media-upload-sessions|public|records|subscriptions|sync|tags|templates)(/|$) {
        proxy_pass http://fractonica_api;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $fractonica_connection_upgrade;
    }

    location = /openapi.yaml {
        proxy_pass http://fractonica_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /docs {
        proxy_pass http://fractonica_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://fractonica_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $fractonica_connection_upgrade;
    }
}
