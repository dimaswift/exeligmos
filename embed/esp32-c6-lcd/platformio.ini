; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-c6-devkitc-1]
platform = espressif32
board = esp32-c6-devkitc-1
framework = arduino
lib_deps =
    ESP32C6LCD147
    symlink://../fractonica-embed

; Saros clock (src/main.cpp): WiFi + NTP synced, two OctalGlyphs (depth 5
; each) showing a 10-digit Saros-cycle phase-address, pushed straight to
; the display driver with dirty-rect-only updates (no LVGL). Build/flash
; with:
;   pio run -t upload
;   pio device monitor          (connection/sync status, then a periodic
;                                 saros=... bin=... status line)