name=fractonica-embed
version=0.1.0
author=Fractonica
maintainer=Fractonica
sentence=Zero-dependency C library for OctalGlyph rendering (into any pixel buffer) and Saros-cycle clock math.
paragraph=og_build_glyph + og_glyph_rasterize render the exact @fractonica/glyph-core filled-polygon glyph geometry directly into a caller-owned ARGB8888 buffer (plus og_glyph_diff_rect for dirty-rect-only redraws), and saros_reading_at computes a Saros-eclipse phase-address from UTC time using a compact flash-resident dataset. Pure ISO C99 -- no LVGL, no Arduino, no OS dependency; push the resulting pixels to any display driver yourself. An optional LVGL widget wrapper lives in optional-lvgl-widget/ (not built by default) for projects that want LVGL's own display pipeline instead.
